name: Build Signed Release AAB

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Semver versionName for this release (e.g. 0.1.0) — human-controlled, not derived from Supabase"
        required: true
        type: string

concurrency:
  group: release-aab-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write   # needed only to commit release-state.json (never version.properties)

jobs:
  release:
    name: Build & Sign AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ENV_ABX_XTOOLS

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Get atomic versionCode from Supabase
        id: bump
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          HTTP_RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "$SUPABASE_URL/rest/v1/rpc/increment_version_code" \
            -H "apikey: $SUPABASE_SECRET_KEY" \
            -H "Authorization: Bearer $SUPABASE_SECRET_KEY" \
            -H "Content-Type: application/json" \
            -d '{"p_app_id": "com.inscopelabs.abx.xtools"}')

          HTTP_STATUS=$(echo "$HTTP_RESPONSE" | grep "HTTP_STATUS:" | cut -d':' -f2)
          RESPONSE=$(echo "$HTTP_RESPONSE" | sed '/HTTP_STATUS:/d')

          echo "HTTP Status: $HTTP_STATUS"
          echo "Response: $RESPONSE"

          if [ "$HTTP_STATUS" -ge 400 ]; then
            echo "::error::Supabase RPC call failed with status $HTTP_STATUS — refusing to build without an atomic version number."
            exit 1
          fi

          VERSION_CODE=$(echo "$RESPONSE" | jq -r '.[0].out_version_code')

          if ! [[ "$VERSION_CODE" =~ ^[0-9]+$ ]]; then
            echo "::error::Unexpected response from Supabase RPC — got '$VERSION_CODE'"
            exit 1
          fi

          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Atomic versionCode for this release: $VERSION_CODE"

      - name: Verify signing secrets are present
        run: |
          missing=0
          [ -z "${{ secrets.KEYSTORE_BASE64 }}" ] && echo "::error::KEYSTORE_BASE64 secret is not set" && missing=1
          [ -z "${{ secrets.STORE_PASSWORD }}" ] && echo "::error::STORE_PASSWORD secret is not set" && missing=1
          [ -z "${{ secrets.KEY_PASSWORD }}" ] && echo "::error::KEY_PASSWORD secret is not set" && missing=1
          if [ "$missing" = "1" ]; then
            echo "::error::One or more release signing secrets are missing."
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > upload-key.jks

      - name: Verify decoded keystore
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          keytool -list -keystore upload-key.jks -storepass "$STORE_PASSWORD" -alias upload || {
            echo "::error::Unable to open keystore using alias 'upload'."
            rm -f upload-key.jks
            exit 1
          }

      - name: Build signed release AAB
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle --no-daemon --stacktrace :app:bundleRelease \
            -PversionCode=${{ steps.bump.outputs.version_code }} \
            -PversionName="${{ inputs.version_name }}"

      - name: Verify AAB exists
        run: |
          AAB="app/build/outputs/bundle/release/app-release.aab"
          if [[ ! -f "$AAB" ]]; then
            echo "::error::Expected release AAB not found at $AAB"
            exit 1
          fi
          echo "Release AAB built: $AAB ($(stat -c%s "$AAB") bytes)"

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: xtools-release-${{ inputs.version_name }}-code${{ steps.bump.outputs.version_code }}
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Record release in release-state.json
        # IMPORTANT: this writes to release-state.json only — NEVER to
        # version.properties. version.properties remains exclusively
        # controlled by the AI Studio build agent per AGENTS.md section 2.
        run: |
          cat > release-state.json <<EOF
          {
            "pending_debug_reset": true,
            "last_release_version_code": ${{ steps.bump.outputs.version_code }},
            "last_release_version_name": "${{ inputs.version_name }}",
            "released_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "released_by": "release-aab.yml"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add release-state.json
          git commit -m "ci: record release versionCode=${{ steps.bump.outputs.version_code }} (${{ inputs.version_name }}) in release-state.json" || echo "Nothing to commit"
          git pull --rebase origin main
          git push

      - name: Write build summary
        if: always()
        run: |
          {
            echo "## Release build summary"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| versionName | ${{ inputs.version_name }} |"
            echo "| versionCode (Supabase-atomic) | ${{ steps.bump.outputs.version_code }} |"
            echo ""
            echo "**Reminder:** \`release-state.json\` now has \`pending_debug_reset: true\`."
            echo "The AI Studio agent will reset \`debugCode\` to \`0001\` and resync"
            echo "\`versionCode\` on its next task per AGENTS.md section 2a — no manual"
            echo "action needed unless you want it done sooner."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up keystore
        if: always()
        run: rm -f upload-key.jks
