<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SQLite CRUD Manager</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0F172A;
            color: #F8FAFC;
            padding: 16px;
            font-size: 14px;
            line-height: 1.5;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 20px;
            text-align: center;
        }

        .badge {
            display: inline-block;
            background: #0284C7;
            color: #FFFFFF;
            font-size: 11px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            color: #F8FAFC;
        }

        .subtitle {
            font-size: 13px;
            color: #94A3B8;
            margin-top: 2px;
        }

        .card {
            background: #1E293B;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .card h2 {
            font-size: 16px;
            font-weight: 600;
            color: #38BDF8;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: #CBD5E1;
            margin-bottom: 4px;
        }

        input[type="text"], input[type="email"], select, textarea {
            width: 100%;
            background: #0F172A;
            border: 1px solid #475569;
            color: #F8FAFC;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus, input[type="email"]:focus, select:focus, textarea:focus {
            border-color: #0284C7;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .button-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 12px;
        }

        .btn {
            padding: 10px 16px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            flex: 1;
            min-width: 110px;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-primary { background: #0284C7; color: #FFFFFF; }
        .btn-success { background: #16A34A; color: #FFFFFF; }
        .btn-warning { background: #D97706; color: #FFFFFF; }
        .btn-danger { background: #DC2626; color: #FFFFFF; }
        .btn-secondary { background: #475569; color: #FFFFFF; }

        .status-badge {
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 6px;
            background: #334155;
            color: #CBD5E1;
        }

        .status-badge.online {
            background: #15803D;
            color: #DCFCE7;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 13px;
        }

        th, td {
            text-align: left;
            padding: 8px 10px;
            border-bottom: 1px solid #334155;
        }

        th {
            background: #0F172A;
            color: #94A3B8;
            font-weight: 600;
        }

        tr:hover {
            background: #334155;
        }

        .action-btn {
            padding: 4px 8px;
            font-size: 11px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            font-weight: 600;
        }

        .action-edit { background: #D97706; color: #FFFFFF; margin-right: 4px; }
        .action-delete { background: #DC2626; color: #FFFFFF; }

        .output-box {
            background: #0F172A;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 10px;
            font-family: monospace;
            font-size: 12px;
            color: #38BDF8;
            max-height: 150px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
            margin-top: 10px;
        }

        .empty-state {
            text-align: center;
            color: #64748B;
            padding: 16px;
            font-style: italic;
        }
    </style>
    <script src="../xtools-bridge.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <div class="badge">Kotlin-JS Bridge DB</div>
            <h1>SQLite Database CRUD</h1>
            <p class="subtitle">Relational database persistence powered by native SQLite</p>
        </header>

        <!-- Status Card -->
        <section class="card">
            <h2>
                <span>Database Engine</span>
                <span id="dbStatus" class="status-badge">Checking...</span>
            </h2>
            <div class="button-group">
                <button class="btn btn-primary" id="btnInitDb">Initialize Table</button>
                <button class="btn btn-secondary" id="btnRefresh">Query Records</button>
                <button class="btn btn-danger" id="btnDropDb">Drop Table</button>
            </div>
        </section>

        <!-- Add / Edit Record Card -->
        <section class="card">
            <h2 id="formTitle">Add New Record</h2>
            <input type="hidden" id="recordId" value="">
            <div class="grid-2">
                <div class="form-group">
                    <label for="inputName">Full Name</label>
                    <input type="text" id="inputName" placeholder="e.g. Alice Smith">
                </div>
                <div class="form-group">
                    <label for="inputEmail">Email Address</label>
                    <input type="email" id="inputEmail" placeholder="e.g. alice@example.com">
                </div>
            </div>
            <div class="form-group">
                <label for="inputRole">Role / Title</label>
                <select id="inputRole">
                    <option value="Administrator">Administrator</option>
                    <option value="Developer" selected>Developer</option>
                    <option value="Designer">Designer</option>
                    <option value="Product Manager">Product Manager</option>
                </select>
            </div>
            <div class="button-group">
                <button class="btn btn-success" id="btnSaveRecord">Save Record</button>
                <button class="btn btn-secondary" id="btnCancelEdit" style="display:none;">Cancel</button>
            </div>
        </section>

        <!-- Records Table Card -->
        <section class="card">
            <h2>User Records Database</h2>
            <div id="tableContainer">
                <div class="empty-state">No records found. Click "Initialize Table" or add a new record.</div>
            </div>
        </section>

        <!-- Raw SQL Console -->
        <section class="card">
            <h2>Custom SQL Console</h2>
            <div class="form-group">
                <textarea id="sqlQuery" rows="2" placeholder="SELECT * FROM users ORDER BY id DESC"></textarea>
            </div>
            <div class="button-group">
                <button class="btn btn-primary" id="btnExecuteSql">Execute Query</button>
            </div>
            <div id="sqlOutput" class="output-box">Query result will appear here...</div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
